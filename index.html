<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잠깐 얘기 좀 할까?</title>
<meta name="description" content="채팅하듯 편하게 답하는 1분 설문입니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#eceef3; --shell:#f7f8fb; --head:rgba(247,248,251,.86);
  --bub:#ffffff; --bub-line:rgba(17,17,26,.07);
  --text:#16161d; --text-2:#54545f; --muted:#8e8e99;
  --line:rgba(17,17,26,.09); --field:#ffffff;
  --accent:#6366f1; --accent-2:#8b5cf6; --on-accent:#fff;
  --accent-soft:rgba(99,102,241,.12);
  --shadow:0 1px 2px rgba(17,17,26,.05),0 10px 30px rgba(17,17,26,.07);
}
body[data-persona="f"]{ --accent:#f04c74; --accent-2:#f97362; --accent-soft:rgba(240,76,116,.12); }
body[data-persona="m"]{ --accent:#3d7bf5; --accent-2:#3fb8e0; --accent-soft:rgba(61,123,245,.12); }

@media (prefers-color-scheme:dark){
  :root{
    --bg:#08080c; --shell:#111117; --head:rgba(17,17,23,.86);
    --bub:#22222c; --bub-line:rgba(255,255,255,.07);
    --text:#eeeef3; --text-2:#a9a9b6; --muted:#6f6f7d;
    --line:rgba(255,255,255,.09); --field:#1b1b23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  }
  body[data-persona="f"]{ --accent:#f2607f; --accent-2:#fb8a72; --accent-soft:rgba(242,96,127,.16); }
  body[data-persona="m"]{ --accent:#5b90f7; --accent-2:#54c5e8; --accent-soft:rgba(91,144,247,.16); }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
              "Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px; line-height:1.55; letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
}

/* ── 앱 셸 ─────────────────────────────── */
.app{
  width:100%; max-width:470px; height:100dvh; max-height:920px;
  display:flex; flex-direction:column; position:relative; overflow:hidden;
  background:var(--shell);
}
@media (min-width:520px) and (min-height:700px){
  .app{ height:min(860px,92dvh); border-radius:26px; box-shadow:var(--shadow); border:1px solid var(--line); }
}

/* ── 시작 화면 ──────────────────────────── */
.intro{
  position:absolute; inset:0; z-index:20;
  display:flex; flex-direction:column; justify-content:center;
  padding:32px 26px; background:var(--shell);
  background-image:
    radial-gradient(620px 420px at 14% 6%,rgba(240,76,116,.13),transparent 62%),
    radial-gradient(580px 400px at 88% 16%,rgba(61,123,245,.13),transparent 60%);
  transition:opacity .45s ease,transform .45s cubic-bezier(.22,1,.36,1);
}
.intro.hide{ opacity:0; transform:scale(.97); pointer-events:none; }
.intro h1{ margin:0 0 10px; font-size:27px; font-weight:750; letter-spacing:-.032em; line-height:1.3; }
.intro p{ margin:0 0 30px; color:var(--text-2); font-size:15px; }
.picks{ display:grid; gap:12px; }
.pick{
  display:flex; align-items:center; gap:14px; width:100%;
  padding:17px 18px; border:1.5px solid var(--line); border-radius:17px;
  background:var(--bub); color:var(--text); font:inherit; font-weight:600;
  cursor:pointer; text-align:left;
  transition:transform .18s cubic-bezier(.22,1,.36,1),border-color .18s,box-shadow .18s;
}
.pick:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
.pick small{ display:block; font-weight:450; font-size:12.5px; color:var(--muted); margin-top:1px; }
.pick[data-g="f"]:hover{ border-color:#f04c74 }
.pick[data-g="m"]:hover{ border-color:#3d7bf5 }
.pick .av{ flex:0 0 46px; height:46px; }
.intro .note{ margin:26px 0 0; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; }

/* ── 아바타 ────────────────────────────── */
.av{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:grid; place-items:center; overflow:hidden;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:#fff; font-size:13px; font-weight:700;
}
.av.f{ background:linear-gradient(140deg,#f04c74,#f97362) }
.av.m{ background:linear-gradient(140deg,#3d7bf5,#3fb8e0) }

/* ── 헤더 ─────────────────────────────── */
.bar{
  display:flex; align-items:center; gap:11px; padding:14px 16px;
  border-bottom:1px solid var(--line);
  background:var(--head); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  position:relative; z-index:5;
}
.bar .who{ flex:1; min-width:0 }
.bar b{ display:block; font-size:15px; font-weight:650; letter-spacing:-.02em }
.bar .st{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px }
.dot{ width:6px; height:6px; border-radius:50%; background:#22c55e }
.step{ font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums }

/* ── 대화 로그 ──────────────────────────── */
.log{
  flex:1; overflow-y:auto; overscroll-behavior:contain;
  padding:18px 14px 8px; display:flex; flex-direction:column; gap:3px;
  scrollbar-width:thin;
}
.log::-webkit-scrollbar{ width:6px }
.log::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px }

.row{ display:flex; gap:8px; align-items:flex-end; margin-top:9px; animation:pop .32s cubic-bezier(.22,1,.36,1) }
.row.me{ flex-direction:row-reverse }
.row.tight{ margin-top:2px }
.row .av{ opacity:0 }
.row.first .av{ opacity:1 }
.row.me .av{ display:none }

.bub{
  max-width:74%; padding:10px 14px; font-size:14.7px; line-height:1.55;
  border-radius:17px; white-space:pre-wrap; word-break:break-word;
}
.row.them .bub{ background:var(--bub); border:1px solid var(--bub-line); border-bottom-left-radius:6px; }
.row.them.tight .bub{ border-top-left-radius:6px }
.row.me .bub{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--on-accent); border-bottom-right-radius:6px;
  box-shadow:0 3px 12px var(--accent-soft);
}
.row.me.tight .bub{ border-top-right-radius:6px }
.t{ font-size:10.5px; color:var(--muted); flex-shrink:0; padding-bottom:3px }

.typing{ display:flex; gap:4px; padding:14px 15px }
.typing i{ width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.3s infinite }
.typing i:nth-child(2){ animation-delay:.18s } .typing i:nth-child(3){ animation-delay:.36s }

.sys{ align-self:center; margin:14px 0 4px; padding:5px 13px; border-radius:999px;
      background:var(--accent-soft); color:var(--accent); font-size:11.5px; font-weight:600 }

/* ── 입력부 ────────────────────────────── */
.foot{ border-top:1px solid var(--line); background:var(--head);
       backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
       padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
.chips{ display:flex; flex-wrap:wrap; gap:7px; padding:0 2px 10px }
.chips:empty{ display:none }
.chip{
  padding:9px 15px; border-radius:999px; border:1.5px solid var(--accent);
  background:transparent; color:var(--accent); font:inherit; font-size:13.5px; font-weight:600;
  cursor:pointer; transition:all .16s cubic-bezier(.22,1,.36,1);
  animation:pop .3s cubic-bezier(.22,1,.36,1) backwards;
}
.chip:hover{ background:var(--accent-soft); transform:translateY(-1px) }
.chip.on{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent }
.chip.go{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent }
.chip.skip{ border-color:var(--line); color:var(--muted) }
.chip.skip:hover{ background:var(--line) }

.entry{ display:flex; gap:8px; align-items:flex-end }
.entry textarea{
  flex:1; min-height:42px; max-height:110px; resize:none;
  padding:10px 15px; border:1.5px solid var(--line); border-radius:21px;
  background:var(--field); color:var(--text); font:inherit; font-size:15px; line-height:1.45;
  transition:border-color .18s;
}
.entry textarea:focus{ outline:none; border-color:var(--accent) }
.entry textarea::placeholder{ color:var(--muted) }
.entry textarea:disabled{ opacity:.5 }
.send{
  flex:0 0 42px; height:42px; border:0; border-radius:50%; cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid; place-items:center; transition:transform .16s,opacity .16s;
}
.send:hover:not(:disabled){ transform:scale(1.06) }
.send:disabled{ opacity:.35; cursor:default }
.send svg{ width:19px; height:19px; stroke:#fff; fill:none; stroke-width:2.2;
           stroke-linecap:round; stroke-linejoin:round }

.hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden }

@keyframes pop{ from{ opacity:0; transform:translateY(7px) } }
@keyframes blink{ 0%,60%,100%{ opacity:.28; transform:translateY(0) } 30%{ opacity:1; transform:translateY(-3px) } }
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important } }
</style>
</head>
<body>

<div class="app">

  <!-- 시작 화면 -->
  <section class="intro" id="intro">
    <h1>잠깐, 얘기 좀 할까?</h1>
    <p>설문지처럼 딱딱하게 말고<br>그냥 편하게 얘기하듯 답해줘.</p>
    <div class="picks">
      <button class="pick" data-g="f" type="button">
        <span class="av f">언니</span>
        <span>언니랑 얘기할래<small>여성</small></span>
      </button>
      <button class="pick" data-g="m" type="button">
        <span class="av m">형</span>
        <span>형이랑 얘기할래<small>남성</small></span>
      </button>
    </div>
    <p class="note">답은 아래 버튼을 눌러도 되고,<br>직접 채팅으로 적어줘도 돼.</p>
  </section>

  <!-- 채팅 헤더 -->
  <div class="bar">
    <span class="av" id="hav">?</span>
    <div class="who">
      <b id="hname">누구랑 얘기할까</b>
      <span class="st"><i class="dot"></i><span id="hstat">온라인</span></span>
    </div>
    <span class="step" id="hstep"></span>
  </div>

  <!-- 대화 -->
  <div class="log" id="log"></div>

  <!-- 입력 -->
  <div class="foot">
    <div class="chips" id="chips"></div>
    <div class="entry">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요" disabled
                autocomplete="off" enterkeyhint="send"></textarea>
      <button class="send" id="send" type="button" disabled aria-label="보내기">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div class="hp" aria-hidden="true">
    <label>홈페이지 <input type="text" id="hp" tabindex="-1" autocomplete="off"></label>
  </div>
</div>

<script>
// ── 설정: Apps Script 웹 앱 주소 ──────────────────────────────
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyoY955vCmQSYgXuC2JgvWME4uSujfCapjPJFFwNZDsFtXEpRim_vQEdj_HYetex_-6Qw/exec';

const $ = function (id) { return document.getElementById(id); };
const log = $('log'), chips = $('chips'), input = $('input'), sendBtn = $('send');
const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

const PERSONA = { f: { name: '언니' }, m: { name: '형' } };
let g = null;                 // 'f' | 'm'
let step = 0;
let picked = [];              // 복수 선택 임시 보관
let waiting = false;          // 사용자 입력 대기 중인지
const answers = {};

/* 말풍선 대본.
   문자열 하나면 남녀 공통, {f:'',m:''} 면 말투를 따로 씁니다.       */
const FLOW = [
  {
    key: '연령대',
    ask: [
      { f: '와 반가워! 나 요즘 이거 만들고 있는데\n솔직한 얘기 좀 듣고 싶어서 ㅎㅎ',
        m: '오 왔네 ㅋㅋ 반갑다\n나 요즘 이거 만들고 있는데 솔직한 얘기 좀 듣고 싶어서' },
      '오래 안 걸려, 1분이면 돼!',
      { f: '먼저 너 몇 살대야?', m: '일단 너 몇 살대냐?' }
    ],
    options: ['10대', '20대', '30대', '40대', '50대 이상']
  },
  {
    key: '유입경로',
    ask: [
      { f: '오케이 ㅎㅎ\n근데 우리 어떻게 알게 됐더라?',
        m: 'ㅇㅋㅇㅋ\n근데 우리 어떻게 알게 됐지?' }
    ],
    options: [
      { label: '아는 사람이 알려줬어', value: '지인 추천' },
      { label: '검색하다 봤어', value: '검색 (구글, 네이버 등)' },
      { label: 'SNS에서', value: 'SNS' },
      { label: '광고 보고', value: '광고' },
      { label: '기억 안 나', value: '기타' }
    ]
  },
  {
    key: '만족도',
    ask: [
      { f: '그렇구나!\n그럼 이제 진짜 솔직하게 물어볼게',
        m: '그렇구나\n자 이제 진짜 솔직하게 하나 물어볼게' },
      { f: '5점 만점이면 몇 점 줄 거야?\n눈치보지 말고 ㅋㅋ', m: '5점 만점에 몇 점?\n눈치 ㄴㄴ 솔직하게 ㅋㅋ' }
    ],
    options: [
      { label: '1점', value: '1 매우 불만족' },
      { label: '2점', value: '2 불만족' },
      { label: '3점', value: '3 보통' },
      { label: '4점', value: '4 만족' },
      { label: '5점', value: '5 매우 만족' }
    ]
  },
  {
    key: '유용한점',
    multi: true,
    ask: [
      { f: '고마워 ㅠㅠ\n어떤 점이 괜찮았어? 여러 개 골라도 돼!',
        m: '오케이 고맙다\n어떤 게 괜찮았냐? 여러 개 골라도 됨' }
    ],
    options: ['사용 편의성', '속도', '디자인', '가격', '고객지원'],
    labels: {
      '사용 편의성': '쓰기 편했어', '속도': '빨라서 좋았어', '디자인': '디자인이 예뻐',
      '가격': '가격이 괜찮아', '고객지원': '문의하면 잘 답해줘'
    }
  },
  {
    key: '추천의향',
    ask: [
      { f: '오 그랬구나!\n그럼 친구한테 추천할 만해?', m: '오키 ㅋㅋ\n그럼 친구한테 추천할 만하냐?' }
    ],
    options: [
      { label: '응 추천할 거야', value: '예' },
      { label: '음 아닌 것 같아', value: '아니오' },
      { label: '아직 잘 모르겠어', value: '잘 모르겠음' }
    ]
  },
  {
    key: '좋았던점',
    free: true,
    ask: [
      { f: '이제 거의 다 왔어!\n제일 좋았던 거 하나만 말해줄래? 짧아도 괜찮아',
        m: '거의 다 왔다\n제일 좋았던 거 하나만 말해줘라 짧아도 됨' }
    ],
    placeholder: '편하게 적어줘'
  },
  {
    key: '개선점',
    free: true, optional: true,
    ask: [
      { f: '고마워! 마지막이야\n반대로 이건 좀 고쳤으면 좋겠다 하는 거 있어?',
        m: 'ㅇㅋ 마지막\n반대로 이건 좀 고쳤으면 하는 거 있냐?' }
    ],
    placeholder: '없으면 그냥 넘어가도 돼',
    skip: '딱히 없어'
  }
];

/* ── 유틸 ─────────────────────────────── */
function pick(v) { return (v && typeof v === 'object' && 'f' in v) ? v[g] : v; }

function now() {
  const d = new Date(), h = d.getHours();
  return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
}

function toBottom() { log.scrollTop = log.scrollHeight; }

let lastSide = null;
function bubble(side, text) {
  const row = document.createElement('div');
  row.className = 'row ' + side + (lastSide === side ? ' tight' : ' first');
  lastSide = side;

  const av = document.createElement('span');
  av.className = 'av ' + g;
  av.textContent = PERSONA[g].name;

  const b = document.createElement('div');
  b.className = 'bub';
  b.textContent = text;

  const t = document.createElement('span');
  t.className = 't';
  t.textContent = now();

  row.appendChild(av); row.appendChild(b); row.appendChild(t);
  log.appendChild(row); toBottom();
}

async function say(text) {
  // 입력 중 표시
  const row = document.createElement('div');
  row.className = 'row them first';
  const av = document.createElement('span');
  av.className = 'av ' + g; av.textContent = PERSONA[g].name;
  const b = document.createElement('div');
  b.className = 'bub typing';
  b.innerHTML = '<i></i><i></i><i></i>';
  row.appendChild(av); row.appendChild(b);
  log.appendChild(row); toBottom();

  $('hstat').textContent = '입력 중...';
  await sleep(Math.min(1100, Math.max(420, text.length * 42)));
  row.remove();
  $('hstat').textContent = '온라인';

  bubble('them', text);
  await sleep(180);
}

function setEntry(on, ph) {
  input.disabled = !on;
  sendBtn.disabled = !on;
  input.placeholder = ph || '메시지를 입력하세요';
  if (on) setTimeout(function () { if (window.innerWidth > 640) input.focus(); }, 60);
}

/* ── 진행 ─────────────────────────────── */
async function runStep() {
  if (step >= FLOW.length) return finish();

  const s = FLOW[step];
  $('hstep').textContent = (step + 1) + ' / ' + FLOW.length;

  chips.innerHTML = '';
  setEntry(false);
  waiting = false;
  picked = [];

  for (const line of s.ask) await say(pick(line));

  // 선택지 버튼
  if (s.options) {
    s.options.forEach(function (o, i) {
      const value = typeof o === 'string' ? o : o.value;
      const label = typeof o === 'string' ? (s.labels && s.labels[o]) || o : o.label;
      const c = document.createElement('button');
      c.type = 'button'; c.className = 'chip'; c.textContent = label;
      c.style.animationDelay = (i * 40) + 'ms';
      c.onclick = function () {
        if (s.multi) {
          const at = picked.indexOf(value);
          if (at >= 0) picked.splice(at, 1); else picked.push(value);
          c.classList.toggle('on');
          confirm.style.display = picked.length ? '' : 'none';
        } else {
          answer(value, label);
        }
      };
      chips.appendChild(c);
    });
  }

  // 복수 선택 확정 버튼
  var confirm = null;
  if (s.multi) {
    confirm = document.createElement('button');
    confirm.type = 'button'; confirm.className = 'chip go';
    confirm.textContent = '다 골랐어';
    confirm.style.display = 'none';
    confirm.onclick = function () {
      if (!picked.length) return;
      const labels = picked.map(function (v) { return (s.labels && s.labels[v]) || v; });
      answer(picked.join(', '), labels.join(', '));
    };
    chips.appendChild(confirm);
  }

  // 건너뛰기
  if (s.skip) {
    const sk = document.createElement('button');
    sk.type = 'button'; sk.className = 'chip skip'; sk.textContent = s.skip;
    sk.onclick = function () { answer('', s.skip); };
    chips.appendChild(sk);
  }

  waiting = true;
  setEntry(true, s.placeholder || '골라도 되고 직접 적어도 돼');
  toBottom();
}

/* 답변 확정 — value는 시트에 저장될 값, shown은 말풍선에 보일 문구 */
function answer(value, shown) {
  if (!waiting) return;
  waiting = false;

  const s = FLOW[step];
  answers[s.key] = value;

  bubble('me', shown || value || '(넘어감)');
  chips.innerHTML = '';
  setEntry(false);
  input.value = ''; input.style.height = '';

  step++;
  setTimeout(runStep, 420);
}

/* 직접 타이핑한 답변 */
function sendTyped() {
  const v = input.value.trim();
  if (!v || !waiting) return;
  answer(v, v);
}

/* ── 전송 ─────────────────────────────── */
async function finish() {
  $('hstep').textContent = '';
  await say(pick({ f: '좋아, 다 끝났어! 잠깐만 저장할게...', m: 'ㅇㅋ 끝! 잠깐만 저장할게' }));

  answers['성별'] = (g === 'f' ? '여성' : '남성');
  const hpv = $('hp').value;
  if (hpv) answers['website'] = hpv;

  try {
    await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(answers)
    });

    await say(pick({
      f: '저장 완료! 진짜 고마워 ㅠㅠ\n네 얘기 잘 참고해서 더 좋게 만들어볼게',
      m: '저장 완료 ㅋㅋ 진짜 고맙다\n얘기해준 거 잘 참고해서 더 좋게 만들어볼게'
    }));
    await say(pick({ f: '오늘 하루도 잘 보내! 🤍', m: '오늘 하루도 잘 보내라 👍' }));

    const end = document.createElement('div');
    end.className = 'sys'; end.textContent = '대화가 종료되었습니다';
    log.appendChild(end); toBottom();
    $('hstat').textContent = '대화 종료';

  } catch (err) {
    await say(pick({
      f: '앗, 저장이 안 됐어 ㅠㅠ 인터넷 확인하고 다시 눌러줄래?',
      m: '앗 저장이 안 됐다 인터넷 확인하고 다시 눌러줘'
    }));
    const again = document.createElement('button');
    again.type = 'button'; again.className = 'chip go'; again.textContent = '다시 보내기';
    again.onclick = function () { chips.innerHTML = ''; finish(); };
    chips.appendChild(again);
  }
}

/* ── 이벤트 ───────────────────────────── */
document.querySelectorAll('.pick').forEach(function (btn) {
  btn.onclick = function () {
    g = btn.dataset.g;
    document.body.dataset.persona = g;
    $('intro').classList.add('hide');
    $('hav').className = 'av ' + g;
    $('hav').textContent = PERSONA[g].name;
    $('hname').textContent = PERSONA[g].name;
    setTimeout(function () { $('intro').style.display = 'none'; runStep(); }, 380);
  };
});

sendBtn.onclick = sendTyped;

input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendTyped(); }
});
input.addEventListener('input', function () {
  input.style.height = 'auto';
  input.style.height = Math.min(110, input.scrollHeight) + 'px';
});
</script>
</body>
